docs: |-
  Sign-in endpoint for the JECIS backend. Use this endpoint to authenticate a user with their email and password and obtain an access token that can be used to authorize subsequent requests.

  **HTTP Request**

  - Method: `POST`
      
  - URL: `{{BASE_URL}}/auths/get_access`
      

  **Headers**

  - `x-token` (string, required): Static or pre-issued token required by the JECIS backend to allow the sign-in attempt.
      

  **Request Body (JSON)**

  - `email` (string, required): User’s login email (e.g., `fernando.riyo@jec.co.id`).
      
  - `password` (string, required): User’s login password.
      

  **Successful Response (200 OK)**  
  Typically returns:

  - An access token (e.g., JWT) that must be sent in subsequent requests (commonly via an authorization or custom header).
      
  - Additional user/session information depending on backend implementation.
      

  **Error Responses**

  - `4xx` (e.g., 400/401/403): Invalid credentials, missing/invalid `x-token`, or malformed request body.
      
  - `5xx`: Server-side errors when the authentication service is unavailable or fails unexpectedly.
      

  Use this request as the first step in workflows that require authenticated access to other JECIS backend endpoints.
