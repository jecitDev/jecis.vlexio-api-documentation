docs: |-
  ## Overview

  This endpoint authenticates a user in the **sandbox** environment and returns:

  - an **access token** (`access_token`) to be used in subsequent API calls, and
      
  - a **refresh token** (`refresh_token`) to obtain new access tokens when the current one expires.
      

  After a successful response, the tokens are stored as collection variables:

  - `xtoken` → access token
      
  - `x-refresh-token` → refresh token
      

  These variables can then be used by other requests in the collection.

  ---

  ## Request

  - **Method:** `POST`
      
  - **URL:** `{{BASE_URL}}/auths/get_token`
      
  - **Environment:** `SB_JECIS_STAGGING_BACKEND` (uses `{{BASE_URL}}`)
      

  ---

  ## Headers

  | Name | Type | Required | Description | Example |
  | --- | --- | --- | --- | --- |
  | x-token | string | Yes | Token used for sandbox auth flows (e.g., bootstrap or fixed) | `{{xtoken}}` |
  | Content-Type | string | Yes | Payload is sent as JSON | `application/json` |

  > Note: `x-token` is stored as a collection variable `xtoken`. Make sure it is set/updated before calling this endpoint. 
    

  ---

  ## Body (JSON)

  Body type: **raw** → **JSON**

  \`\`\`json  
  {  
  "email": "21170",  
  "password": "**",  
  "company_id": "2da6a1bd-ba62-43ec-91f8-4085d5d6d498",  
  "business_unit_id": "53aad077-9fb1-4f08-85f3-af9fd9a36517",  
  "fcm_token": "123",  
  "station_id": 1,  
  "app": "web"  
  }
