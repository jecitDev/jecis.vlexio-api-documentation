info:
  name: AUTH - POST AUTHS SIGNIN GET TOKEN Live
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/auths/get_token"
  headers:
    - name: x-token
      value: "{{xtoken}}"
      disabled: true
  body:
    type: json
    data: |
      {
          "email": "{{userid}}",
          "password": "{{password}}",
          "company_id": "71b53dd1-2802-4527-8b5c-d54173392222",
          "business_unit_id": "18e9ea73-7343-4be2-a8e4-47b652e56981",
          "fcm_token": "",
          "station_id": 1,
          "app": "vlexio"
      }
  auth: inherit

runtime:
  variables:
    - name: password
      value: Sijec123
    - name: userid
      value: "21170"
  scripts:
    - type: after-response
      code: "var data = res.getBody();\r

        bru.setCollectionVar(\"xtoken\", data.data.access_token);\r

        bru.setCollectionVar(\"API_TOKEN\", data.data.access_token);\r

        bru.setCollectionVar(\"master_xtoken\", data.data.access_token);\r

        bru.setCollectionVar(\"x-refresh-token\", data.data.refresh_token);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

