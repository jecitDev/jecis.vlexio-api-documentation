info:
  name: GET LIST
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/v1/professions?page=1&page_size=10&sort_order=ASC&sort_by=name"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
    - name: sort_order
      value: ASC
      type: query
    - name: keywords
      value: officer
      type: query
      disabled: true
    - name: name
      value: ""
      type: query
      disabled: true
    - name: is_active
      value: "true"
      type: query
      disabled: true
    - name: sort_by
      value: name
      type: query
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
