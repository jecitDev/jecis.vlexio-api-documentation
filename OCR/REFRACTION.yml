info:
  name: REFRACTION
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/ocr/refraction/upload"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /C:/Users/USER/Downloads/mess refraction.jpeg
      - name: type
        type: text
        value: tonoref
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
