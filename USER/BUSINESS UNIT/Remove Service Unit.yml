info:
  name: Remove Service Unit
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{BASE_URL}}/v1/user/business_unit/:user_id/:business_unit_id/departments/:department_id/service_units/:service_unit_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
    - name: X-User-ID
      value: "{{xuserid}}"
  params:
    - name: user_id
      value: "21170"
      type: path
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path
    - name: department_id
      value: 6e6a6fbb-367e-4c6f-bae4-d3e7110ec3b8
      type: path
    - name: service_unit_id
      value: G201
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

