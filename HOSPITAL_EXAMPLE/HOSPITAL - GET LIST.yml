info:
  name: HOSPITAL - GET LIST
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/v1/hospitals/?page=1&pageSize=12"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "12"
      type: query
    - name: isActive
      value: "false"
      type: query
      disabled: true
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: HOSPITAL - GET LIST
    request:
      url: "{{BASE_URL}}/v1/hospitals/?page=1&pageSize=12&is_active=true"
      method: GET
      headers:
        - name: x-token
          value: "{{xtoken}}"
      params:
        - name: page
          value: "1"
          type: query
        - name: pageSize
          value: "12"
          type: query
        - name: is_active
          value: "true"
          type: query
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Date
          value: Fri, 01 Mar 2024 03:04:31 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "114"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
        - name: X-Download-Options
          value: noopen
        - name: X-Permitted-Cross-Domain-Policies
          value: none
        - name: Vary
          value: Origin
        - name: Access-Control-Allow-Origin
          value: "*"
      body:
        type: json
        data: |-
          {
              "code": 401,
              "error": {
                  "addt-message": "Error Validate Token",
                  "error": "unauthenticated",
                  "message": "token not found"
              }
          }
