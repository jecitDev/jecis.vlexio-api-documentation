info:
  name: GET LIST
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/v1/ServiceRoom?page=1&page_size=100&sort_by=room_name&sort_order=ASC"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "100"
      type: query
    - name: sort_by
      value: room_name
      type: query
    - name: sort_order
      value: ASC
      type: query
    - name: keywords
      value: Anggrek
      type: query
      disabled: true
    - name: service_unit_id
      value: C101
      type: query
      disabled: true
    - name: is_operating_room
      value: "true"
      type: query
      disabled: true
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
