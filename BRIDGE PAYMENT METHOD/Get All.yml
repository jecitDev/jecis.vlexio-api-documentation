info:
  name: Get All
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/v1/bridgepaymentmethods"
  headers:
    - name: x-token
      value: "{{master_xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
