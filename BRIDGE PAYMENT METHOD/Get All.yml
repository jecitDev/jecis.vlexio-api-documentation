    request:
      url: "{{BASE_URL}}/v1/bridgepaymentmethods"
      method: GET
      headers:
        - name: x-token
          value: "{{master_xtoken}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 09 Apr 2025 09:40:59 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "267"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
