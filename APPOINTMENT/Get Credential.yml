info:
  name: Get Credential
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE_URL}}/v1/appointments/credential/:business_unit_id/:appointment_no"
  headers:
    - name: x-token
      value: "{{admission_xtoken}}"
  params:
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path
    - name: appointment_no
      value: APKDY%2F250515-00001
      type: path
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/v1/appointments/credential/:business_unit_id/:appointment_no"
      method: GET
      headers:
        - name: x-token
          value: "{{admission_xtoken}}"
      params:
        - name: business_unit_id
          value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
          type: path
        - name: appointment_no
          value: APKDY%2F250515-00001
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Fri, 16 May 2025 02:30:52 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "109"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
