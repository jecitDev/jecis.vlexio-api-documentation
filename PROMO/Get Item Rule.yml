      value: "{{xtoken}}"
  params:
    - name: id
      value: 3a037e29-71c4-42be-b4f9-cf1de0d2b900
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

