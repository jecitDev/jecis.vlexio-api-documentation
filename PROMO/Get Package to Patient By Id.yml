info:
  name: Get Package to Patient By Id
  type: http
  seq: 22

http:
  method: GET
  url: "{{BASE_URL}}/v1/promo/promo-to-patient/:package_id/:patient_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: package_id
      value: 9a368312-f26a-49e1-80bd-b12e085cecae
      type: path
    - name: patient_id
      value: PKDY250707-0001
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

