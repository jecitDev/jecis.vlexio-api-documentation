http:
  method: POST
  url: "{{BASE_URL}}/v1/promo/rate-book/session"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  body:
    type: json
    data: "{\r

      \    \"package_id\": \"8acfdb6d-1189-403d-8abb-82b05ee2432a\"\r

      }\r\n"

