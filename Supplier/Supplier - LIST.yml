info:
  name: Supplier - LIST
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/v1/Supplier?page=1&page_size=10"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
    - name: sort_by
      value: id
      type: query
      disabled: true
    - name: sort_order
      value: asc
      type: query
      disabled: true
    - name: category_code
      value: CAT001
      type: query
      disabled: true
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

