http:
  method: POST
  url: "{{BASE_URL}}/v1/master-examination-items/:id/reactivate"
  headers:
    - name: x-token
      value: "{{medical_record_xtoken}}"
    - name: X-User-ID
      value: admin
  params:
    - name: id
      value: 194ed7c0-1944-4f3f-803d-4fa0d9dde925
      type: path
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

