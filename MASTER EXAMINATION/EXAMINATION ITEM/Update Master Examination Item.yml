info:
  name: Update Master Examination Item
  type: http
  seq: 4

http:
  method: PUT
  url: "{{BASE_URL}}/v1/master-examination-items/:id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
    - name: X-User-ID
      value: admin
  params:
    - name: id
      value: e7190ebb-b634-4ee9-875e-2889ca9de967
      type: path
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

      \    \"examination_id\": \"dbf32911-15b6-4cdc-9298-339bd216eaf1\",\r

      \    \"name\": \"OCT\",\r

      \    \"description\": \"OCT\",\r

      \    \"item_list\": [\"OCT-3\",\"OCT-2\",\"OCT-1\"],\r

      \    \"is_active\": true\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

