info:
  name: Get Master Examination Item By ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/v1/master-examination-items/:id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: id
      value: e7190ebb-b634-4ee9-875e-2889ca9de967
      type: path
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/v1/master-examination-items/:id"
      method: GET
      headers:
        - name: x-token
          value: "{{medical_record_xtoken}}"
      params:
        - name: id
          value: 194ed7c0-1944-4f3f-803d-4fa0d9dde925
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 08 Oct 2025 00:58:50 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "400"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
        - name: X-Download-Options
