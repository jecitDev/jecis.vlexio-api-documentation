info:
  name: Create Master Examination Item
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/v1/master-examination-items"
  headers:
    - name: x-token
      value: "{{xtoken}}"
    - name: X-User-ID
      value: admin
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

      \    \"examination_id\": \"dbf32911-15b6-4cdc-9298-339bd216eaf1\",\r

      \    \"name\": \"OCT\",\r

      \    \"description\": \"Pemeriksaan OCT\",\r

      \    \"item_list\": [\"OCT-1\",\"OCT-2\",\"OCT-3\",\"OCT-4\"],\r

      \    \"is_active\": true\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/v1/master-examination-items"
      method: POST
