info:
  name: Get Master Examination By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/v1/master-examinations/:id"
  headers:
    - name: x-token
      value: "{{medical_record_xtoken}}"
  params:
    - name: id
      value: efecf080-5c76-4f2a-a127-b6ce516f788c
      type: path
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

