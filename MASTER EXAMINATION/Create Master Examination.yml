info:
  name: Create Master Examination
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/v1/master-examinations"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

      \    \"name\": \"CDC\",\r

      \    \"description\": \"CDC\",\r

      \    \"is_active\": true\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/v1/master-examinations"
      method: POST
      headers:
        - name: x-token
          value: "{{medical_record_xtoken}}"
      body:
        type: json
        data: "{\r

          \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

          \    \"name\": \"Medical Check-up\",\r

          \    \"description\": \"Comprehensive medical examination for employees\",\r

          \    \"is_active\": true,\r

          \    \"user_create\": \"admin\"\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Mon, 06 Oct 2025 04:11:57 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "186"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
        - name: X-Download-Options
          value: noopen
        - name: X-Permitted-Cross-Domain-Policies
          value: none
        - name: Vary
          value: Origin
        - name: Access-Control-Allow-Origin
          value: "*"
      body:
        type: json
        data: |-
          {
              "code": 201,
              "data": {
                  "id": "efecf080-5c76-4f2a-a127-b6ce516f788c",
                  "business_unit_id": "53aad077-9fb1-4f08-85f3-af9fd9a36517",
                  "user_create": "admin",
                  "created_at": "2025-10-06T11:11:57+07:00"
              }
          }
  - name: Err name already exists within same business unit id
    request:
      url: "{{BASE_URL}}/v1/master-examinations"
      method: POST
      headers:
        - name: x-token
          value: "{{medical_record_xtoken}}"
      body:
        type: json
        data: "{\r

          \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

          \    \"name\": \"Medical Check-up\",\r

          \    \"description\": \"Comprehensive medical examination for employees\",\r

          \    \"is_active\": true,\r

          \    \"user_create\": \"admin\"\r

          }"
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Date
          value: Mon, 06 Oct 2025 04:12:19 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "65"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
        - name: X-Download-Options
          value: noopen
        - name: X-Permitted-Cross-Domain-Policies
          value: none
        - name: Vary
          value: Origin
        - name: Access-Control-Allow-Origin
          value: "*"
      body:
        type: json
        data: |-
          {
              "message": "master_examination.name_already_exists",
              "status": 409
          }
