info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/countries"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  body:
    type: json
    data: "{\r

      \    \"id\": \"SG\",\r

      \    \"name\": \"Singapore\",\r

      \    \"abbreviation\": \"SG\",\r

      \    \"default_currency_id\": \"SGD\",\r

      \    \"prefix_phone_number\": \"\",\r

      \    \"created_at\": \"2025-09-25T14:08:41+07:00\",\r

      \    \"user_create\": \"ferdinand\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/countries"
      method: POST
      headers:
        - name: x-token
          value: "{{xtoken}}"
      body:
        type: json
        data: "{\r

          \    \"id\": \"IDN\",\r

          \    \"name\": \"Indonesia\",\r

          \    \"abbreviation\": \"IDN\",\r

          \    \"default_currency_id\": \"IDR\",\r

          \    \"prefix_phone_number\": \"+62\",\r

          \    \"created_at\": \"2025-09-25T14:08:41+07:00\",\r

          \    \"user_create\": \"ferdinand\"\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Fri, 26 Sep 2025 03:34:11 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "212"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
        - name: X-Download-Options
          value: noopen
        - name: X-Permitted-Cross-Domain-Policies
          value: none
      body:
        type: json
        data: |-
          {
              "code": 201,
              "data": {
                  "id": "IDN",
                  "name": "Indonesia",
                  "abbreviation": "IDN",
                  "default_currency_id": "IDR",
                  "prefix_phone_number": "+62",
                  "is_active": true,
                  "created_at": "2025-09-25T14:08:41+07:00",
                  "user_create": "ferdinand"
              }
          }
