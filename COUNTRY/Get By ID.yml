info:
  name: Get By ID
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/countries/:id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
      disabled: true
  params:
    - name: id
      value: ID
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/countries/:id"
      method: GET
      headers:
        - name: x-token
          value: "{{xtoken}}"
          disabled: true
      params:
        - name: id
          value: IDN
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Fri, 26 Sep 2025 03:42:33 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "250"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
        - name: X-Download-Options
          value: noopen
        - name: X-Permitted-Cross-Domain-Policies
          value: none
      body:
        type: json
        data: |-
          {
              "code": 200,
              "data": {
                  "id": "IDN",
                  "name": "Indonesia",
                  "abbreviation": "ID",
                  "prefix_phone_number": "+62",
                  "is_active": true,
                  "created_at": "2025-09-25T14:08:41+07:00",
                  "user_create": "ferdinand",
                  "updated_at": "2025-09-25T14:08:41+07:00",
                  "user_update": "ferdinand"
              }
          }
  - name: Not Found
    request:
      url: "{{BASE_URL}}/countries/:id"
      method: GET
      headers:
        - name: x-token
          value: "{{xtoken}}"
          disabled: true
      params:
        - name: id
          value: ID
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Date
          value: Fri, 26 Sep 2025 03:45:02 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "44"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
        - name: X-Download-Options
          value: noopen
        - name: X-Permitted-Cross-Domain-Policies
          value: none
      body:
        type: json
        data: |-
          {
              "message": "country.not_found",
              "status": 404
          }
