info:
  name: Get Admedika Config
  type: http
  seq: 21

http:
  method: GET
  url: "{{BASE_URL}}/v1/admedika/config/item/:item_type"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: item_type
      value: admedika_queue_status
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get Admedika Config
    request:
      url: "{{BASE_URL}}/v1/admedika/config/item/:item_type"
      method: GET
      headers:
        - name: x-token
          value: "{{xtoken}}"
      params:
        - name: item_type
          value: admedika_queue_status
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Fri, 30 Oct 2026 06:07:53 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "69"
        - name: X-Xss-Protection
          value: "0"
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Cross-Origin-Embedder-Policy
          value: require-corp
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Cross-Origin-Resource-Policy
          value: same-origin
        - name: Origin-Agent-Cluster
          value: ?1
        - name: Referrer-Policy
          value: no-referrer
        - name: X-Dns-Prefetch-Control
          value: off
