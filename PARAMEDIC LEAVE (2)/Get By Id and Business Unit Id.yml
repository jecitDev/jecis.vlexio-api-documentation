info:
  name: Get By Id and Business Unit Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/v1/paramedic-leave/:id/:business_unit_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: id
      value: d8a9888f-d896-4065-8579-2a34ba5d995d
      type: path
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

