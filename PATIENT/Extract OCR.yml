info:
  name: Extract OCR
  type: http
  seq: 10

http:
  method: POST
  url: "{{BASE_URL}}/v1/patients/extract_ocr"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /C:/Users/USER/Downloads/ktp.png
      - name: card_type
        type: text
        value: ektp
      - name: business_unit_id
        type: text
        value: 53aad077-9fb1-4f08-85f3-af9fd9a36517

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

