info:
  name: Insert Bank Account
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/v1/bankaccount"
  headers:
    - name: x-token
      value: "{{master_xtoken}}"
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

      \    \"no_rek\": \"1234567890\",\r

      \    \"atas_nama_bank\": \"John Doe\",\r

      \    \"bank_id\": 1,\r

      \    \"bank_name\": \"Bank ABC\",\r

      \    \"chart_of_account_id\": 2001,\r

      \    \"subledger_id\": 3001,\r

      \    \"journal_code\": \"JRNL001\",\r

      \    \"currency_code\": \"EMC\",\r

      \    \"is_pajak\": true,\r

      \    \"is_real_bank\": true,\r

      \    \"is_payment_ar_bank\": false,\r

      \    \"healthcare_id\": \"004\",\r

      \    \"is_active\": true,\r

      \    \"user_create\": \"admin\",\r

      \    \"created_at\": \"2025-04-07T10:30:00+07:00\"\r

      }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

