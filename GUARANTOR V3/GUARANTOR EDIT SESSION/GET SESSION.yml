info:
  name: GET SESSION
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/v1/marketing/guarantor/contract/session/:session_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: session_id
      value: ""
      type: path
  body:
    type: json
    data: "{\r

      \    \"contract_id\": \"e5fce88d-8087-4a0f-9416-5cd764f5ffe5\"\r

      }\r\n"

runtime:
  scripts:
    - type: after-response
      code: "var data = res.getBody();\r

        bru.setCollectionVar(\"guarantor_item_rule_session_id\", data.data.session_id);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/v1/marketing/guarantor/contract/rate-book/session"
      method: POST
      headers:
        - name: x-token
          value: "{{xtoken}}"
      body:
        type: json
        data: "{\r

          \    \"contract_id\": \"cdf9ba26-a461-4a2f-b029-0a6d60b2a5e7\"\r

          }\r\n"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Mon, 25 Aug 2025 02:27:05 GMT
