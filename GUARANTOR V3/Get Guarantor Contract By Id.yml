    request:
      url: "{{BASE_URL}}/v1/marketing/guarantor/contract/:contract_id"
      method: GET
      headers:
        - name: x-token
          value: "{{xtoken}}"
      params:
        - name: contract_id
          value: 2de71b67-d721-40f1-9663-01f4dd65c40f
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Date
          value: Thu, 12 Jun 2025 09:30:20 GMT
