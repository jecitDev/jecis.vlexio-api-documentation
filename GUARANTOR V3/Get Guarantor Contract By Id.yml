info:
  name: Get Guarantor Contract By Id
  type: http
  seq: 18

http:
  method: GET
  url: "{{BASE_URL}}/v1/marketing/guarantor/contract/:contract_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: contract_id
      value: 0f213b29-9768-4eb9-9727-63cbdb7cedad
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
