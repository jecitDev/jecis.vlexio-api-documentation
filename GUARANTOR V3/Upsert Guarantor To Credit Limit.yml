info:
  name: Upsert Guarantor To Credit Limit
  type: http
  seq: 36

http:
  method: PATCH
  url: "{{BASE_URL}}/v1/marketing/guarantor/credit_limit/:guarantor_id/:business_unit_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: guarantor_id
      value: 280ec528-1bbc-4cab-8746-1aa433934830
      type: path
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path
  body:
    type: json
    data: "{\r

      \    \"user_create\": \"admin_user\",\r

      \    \"created_at\": \"2025-06-17T14:08:41+07:00\",\r

      \    \"data\": [\r

      \        {\"field\": \"credit_limit\", \"value\": \"20000.00\"},\r

      \        {\"field\": \"aging\", \"value\": \"30\"}\r

      \    ]\r

      }\r\n"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

