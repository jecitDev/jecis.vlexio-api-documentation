  type: http
  seq: 10

http:
  method: DELETE
  url: "{{BASE_URL}}/v1/marketing/guarantor/contract/item_rule/bulk"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  body:
    type: json
    data: "{\r

      \    \"item_rules\": [\r

      \        {\r

      \            \"seq_id\": 10\r

      \        }\r

      \    ]\r

      }"

