info:
  name: Get Guarantor Document By Id
  type: http
  seq: 31

http:
  method: GET
  url: "{{BASE_URL}}/v1/marketing/guarantor/contract/document/:id/:contract_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: id
      value: "30"
      type: path
    - name: contract_id
      value: 1b13db98-22a7-4e04-90de-0df645f2a321
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

