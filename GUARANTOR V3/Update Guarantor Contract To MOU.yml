      value: "{{xtoken}}"
  params:
    - name: contract_id
      value: 0851172a-dfa5-44c2-9ee6-c489135d7f55
      type: path
  body:
    type: json
    data: "{\r

      \    \"user_update\": \"ferdinand\",\r

      \    \"mou_date_time\": \"2025-07-02T14:08:41+07:00\",\r

      \    \"updated_at\": \"2025-03-26T14:08:41+07:00\"\r

      }"
