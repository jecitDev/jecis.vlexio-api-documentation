info:
  name: Renewal Guarantor Contract
  type: http
  seq: 50

http:
  method: POST
  url: "{{BASE_URL}}/v1/marketing/guarantor/contract/renewal"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/v1/marketing/guarantor/contract/renewal"
      method: POST
      headers:
        - name: x-token
          value: "{{xtoken}}"
      body:
        type: json
        data: "{\r

          \    \"guarantor_id\": \"5b7b24f9-8ffa-4853-bd52-dd28415b080d\",\r

