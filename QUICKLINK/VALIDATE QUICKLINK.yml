info:
  name: VALIDATE QUICKLINK
  type: http
  seq: 1
http:
  method: POST
  url: "{{BASE_URL}}/quicklink/validate_code"
  headers:
    - name: x-token
      value: "{{xtoken}}"
      disabled: true
  body:
    type: json
    data: "{\r\n    \"quick_link_id\": \"c45f0d2a-3acc-408a-8a08-060873f2ef53\",\r\n    \"url\": \"/signature/view\"\r\n}"
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: "var data = res.getBody();\r\nbru.setCollectionVar(\"xtoken\", data.data.access_token);\r\nbru.setCollectionVar(\"x-refresh-token\", data.data.refresh_token);"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
  - name: SUCCESS
    request:
      url: "{{BASE_URL}}/quicklink/validate_code"
      method: POST
      headers:
        - name: x-token
          value: "{{xtoken}}"
          disabled: true
      body:
        type: json
        data: "{\r\n    \"quick_link_id\": \"c45f0d2a-3acc-408a-8a08-060873f2ef53\",\r\n    \"url\": \"/signature/view\"\r\n}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 02 Dec 2024 04:08:45 GMT
        - name: Content-Type
