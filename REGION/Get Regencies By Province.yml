info:
  name: Get Regencies By Province
  type: http
  seq: 6
http:
  method: GET
  url: "{{BASE_URL}}/v1/regions/provinces/:province/regencies?is_active=true"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: is_active
      value: "true"
      type: query
    - name: province
      value: dki jakarta
      type: path
  body:
    type: json
    data: ""
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
