info:
  name: Get Districts By Regency
  type: http
  seq: 7
http:
  method: GET
  url: "{{BASE_URL_SERVICE_BROKER}}/v1/regions/regencies/:regency/districts?is_active=true"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: is_active
      value: "true"
      type: query
    - name: regency
      value: ""
      type: path
  body:
    type: json
    data: ""
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
examples:
  - name: Success
    request:
      url: "{{BASE_URL_SERVICE_BROKER}}/v1/regions/regencies/:regency/districts?province=dki jakarta&is_active=true"
      method: GET
      headers:
        - name: x-token
          value: "{{xtoken}}"
        - name: X-User-ID
          value: admin
      params:
        - name: province
          value: dki jakarta
          type: query
        - name: is_active
          value: "true"
          type: query
        - name: regency
          value: Administrasi Jakarta Pusat
          type: path
