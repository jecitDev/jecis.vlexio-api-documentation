info:
  name: List
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/v1/Item"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: pageSize
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: List
    request:
      url: "{{BASE_URL}}/v1/Item?page=1&pageSize=10"
      method: GET
      headers:
        - name: x-token
          value: "{{xtoken}}"
      params:
        - name: page
          value: "1"
          type: query
        - name: pageSize
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
