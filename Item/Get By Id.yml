info:
  name: Get By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/v1/Item/:id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: id
      value: 4f1d942d-b20d-464a-a121-a25d45df2fc5
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
