info:
  name: Get All Bank
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/v1/bank"
  headers:
    - name: x-token
      value: "{{master_xtoken}}"
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
