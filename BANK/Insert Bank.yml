info:
  name: Insert Bank
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/v1/bank"
  headers:
    - name: x-token
      value: "{{master_xtoken}}"
  body:
    type: json
    data: "{\r

      \  \"business_unit_id\": \"9f37f3c4-8b9e-4d89-9940-7c9630b176c2\",\r

      \  \"bank_name\": \"bank rakyat maju\",\r

      \  \"bi_code\": \"BRM456\",\r

      \  \"user_create\": \"jane_smith\",\r

      \  \"created_at\": \"2025-04-07T10:30:00+07:00\"\r

      }\r\n"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

