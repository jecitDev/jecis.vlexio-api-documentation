info:
  name: Get By Id and Business Unit Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/v1/examsetups/:id/:business_unit_id"
  headers:
    - name: x-token
      value: "{{medical_record_xtoken}}"
  params:
    - name: id
      value: "1"
      type: path
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path
  body:
    type: json
    data: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

