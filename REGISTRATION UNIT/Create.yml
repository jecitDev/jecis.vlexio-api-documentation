info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/v1/polyclinics"
  headers:
    - name: x-token
      value: "{{admission_xtoken}}"
    - name: X-User-ID
      value: admin
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

      \    \"name\": \"General Medicine Polyclinic\",\r

      \    \"sr_registration_type\": \"IPR\",\r

      \    \"is_active\": true\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
