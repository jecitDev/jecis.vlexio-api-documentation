info:
  name: VALIDATE ACTIVATION CODE
  type: http
  seq: 7

http:
  method: GET
  url: "{{BROKER_URL}}/auth_activation/validate/:user_id/:activation_code"
  headers:
    - name: x-token
      value: "{{xtoken}}"
      disabled: true
  params:
    - name: user_id
      value: "302308"
      type: path
    - name: activation_code
      value: 6e5cf6f6-94fc-42ff-9db8-5cc6d7caf5f9
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

