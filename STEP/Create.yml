info:
  name: Create
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/v1/steps"
  headers:
    - name: x-token
      value: "{{medical_record_xtoken}}"
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

      \    \"alias\": \"STEP001\",\r

      \    \"name\": \"Registration and Check-in\",\r

      \    \"description\": \"Patient registration and initial check-in process\",\r

      \    \"room_id\": \"ROOM001\",\r

      \    \"is_active\": true,\r

      \    \"user_create\": \"admin\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

