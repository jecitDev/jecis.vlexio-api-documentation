  url: "{{BASE_URL}}/v1/examination-item-step-bridges/:examination_item_id/:business_unit_id/:step_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
    - name: X-User-ID
      value: admin
  params:
    - name: examination_item_id
      value: e7190ebb-b634-4ee9-875e-2889ca9de967
      type: path
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
