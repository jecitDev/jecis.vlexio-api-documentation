info:
  name: Create Group Step
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/v1/group-steps"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  body:
    type: json
    data: "{\r

      \    \"business_unit_id\": \"53aad077-9fb1-4f08-85f3-af9fd9a36517\",\r

      \    \"name\": \"CATARACT\",\r

      \    \"description\": \"Pemeriksaan CDC Cataract\",\r

      \    \"steps_id\": [\r

      \        {\r

      \            \"step_id\": \"748da9f5-4b5a-4c77-bbde-7f9c9a98b6c7\",\r

      \            \"order\": 1\r

      \        },\r

      \        {\r

      \            \"step_id\": \"6c06377d-8feb-463e-a96a-55462d7e5773\",\r

      \            \"order\": 2\r

      \        },\r

      \        {\r

      \            \"step_id\": \"b7ddb506-49cf-4e19-93ea-92c5c2b0da39\",\r

      \            \"order\": 2\r

      \        }\r

      \    ],\r

      \    \"is_active\": true,\r

      \    \"user_create\": \"21170\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

