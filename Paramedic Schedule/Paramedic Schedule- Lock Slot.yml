  url: "{{BASE_URL}}/v1/paramedicschedule/lockslot/:id_date_slot/:business_unit_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: id_date_slot
      value: "5824"
      type: path
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path
  body:
    type: json
    data: "{\r

      \    \"lock_start\": \"2025-05-22T14:08:41+07:00\",\r

      \    \"lock_by\": \"admin\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

