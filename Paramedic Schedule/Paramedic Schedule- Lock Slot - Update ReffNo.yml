  headers:
    - name: x-token
      value: "{{admission_xtoken}}"
  params:
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path
    - name: id_date_slot
      value: "3269"
      type: path
  body:
    type: json
    data: "{\r

      \    \"lock_by\": \"admin\",\r

      \    \"lock_start\": \"2025-05-22T14:08:41+07:00\",\r

      \    \"data\": [\r

      \        { \"field\": \"reff_no\", \"value\": \"test123\" }\r

      \    ]\r

      }"
  auth: inherit

settings:
