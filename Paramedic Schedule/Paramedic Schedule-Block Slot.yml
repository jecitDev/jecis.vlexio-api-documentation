info:
  name: Paramedic Schedule-Block Slot
  type: http
  seq: 13

http:
  method: PATCH
  url: "{{BASE_URL}}/v1/paramedicschedule/slot/block/:business_unit_id/:id_psd"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: business_unit_id
      value: 53aad077-9fb1-4f08-85f3-af9fd9a36517
      type: path
    - name: id_psd
      value: "230"
      type: path
  body:
    type: json
    data: "{\r

      \    \"start\": \"09:00\",\r

      \    \"end\": \"09:00\",\r

      \    \"note\": \"testing block slot\",\r

      \    \"user_update\": \"admin\",\r

      \    \"updated_at\": \"2025-05-22T14:08:41+07:00\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

