info:
  name: Master Floor Level - GET By ID
  type: http
  seq: 3
http:
  method: GET
  url: "{{BASE_URL}}/v1/Supplier/getbyid/:id/:business_unit_id"
  headers:
    - name: x-token
      value: "{{xtoken}}"
  params:
    - name: id
      value: "12"
      type: path
    - name: business_unit_id
      value: f64e10b4-0cbf-4fee-ac09-1a4fa199696c
      type: path
  body:
    type: text
    data: ""
  auth:
    type: bearer
    token: "{{xtoken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
